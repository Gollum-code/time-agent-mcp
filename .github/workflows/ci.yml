name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ts:
    name: TypeScript 版测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  test-py:
    name: Python 版测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "mcp>=1.2.0" "pydantic>=2.0" pytest pytest-asyncio
      - name: 运行 pytest
        run: python -m pytest tests_py -q
        env:
          PYTHONPATH: python

  smoke:
    name: 端到端 smoke（TS stdio + HTTP）
    runs-on: ubuntu-latest
    needs: [test-ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/smoke.mjs
      - name: HTTP transport 冒烟
        run: |
          node dist/server.js --http --port 8787 &
          sleep 1.5
          curl -s -X POST http://127.0.0.1:8787/mcp \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | grep -o "agent_clock" | head -1
